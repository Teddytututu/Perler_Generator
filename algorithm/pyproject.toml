[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "outline-ai"
version = "0.0.1"
description = "Semantic outline generation utilities for the image-pindou project"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "Pillow>=10,<12",
  "scipy>=1.11,<2",
  "scikit-image>=0.22,<1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4,<9"]
model = ["torch>=2.2", "torchvision>=0.17"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
